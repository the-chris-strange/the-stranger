version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      semver-minor-days: 3
      semver-patch-days: 7
    directories:
      - /
      - "/packages/*"
      - "/tools/*"
    groups:
      npm-dev-patch-minor:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      npm-runtime-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
      npm-security-patch-minor:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      npm-version-updates:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@the-stranger/*"
      - dependency-name: "@nx/*"
      - dependency-name: nx
    schedule:
      interval: weekly
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
