name: Node.js CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
      - main

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_CI }}

jobs:
  ci:
    strategy:
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: startsWith(github.event_name, 'pull_request')
        uses: nrwl/nx-set-shas@v4
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - if: matrix.node == 24
        run: mise install node@24 && echo "$(mise where node@24)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: lint, test, build, typecheck
        run: pnpm constraints
      - run: pnpm nx run root:constraints-test
      - run: pnpm ci --skipNxCache
