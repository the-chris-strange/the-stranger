packages:
  - packages/*
  - tools/*

allowBuilds:
  "@swc/core": true
  "@parcel/watcher": true
  esbuild: true
  nx: true
  unrs-resolver: true

# mise owns the package-manager installation.
pmOnFail: error
runtimeOnFail: ignore

# Match the previous Yarn npmMinimalAgeGate policy.
minimumReleaseAge: 0
